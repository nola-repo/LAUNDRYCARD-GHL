name: Automated 15-Minute Discovery Scheduler

on:
  schedule:
    # Runs every 15 minutes around the clock, 6 days a week (Mon–Sat)
    - cron: '*/15 * * * 1-6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Discovery mode (live or read-only)'
        required: true
        default: 'live'
        type: choice
        options:
          - live
          - read-only

concurrency:
  group: discovery-sync
  cancel-in-progress: false

jobs:
  discovery:
    name: Run LaundryCard Discovery
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Discovery Endpoint
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://laundrycard-sync.vercel.app' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Triggering automated discovery on ${APP_URL} at $(date -u)..."
          HTTP_RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}\nTIME_TOTAL:%{time_total}" \
            -X GET "${APP_URL}/api/cron/discovery" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Accept: application/json" \
            --max-time 60)

          BODY=$(echo "${HTTP_RESPONSE}" | sed -e '/HTTP_STATUS:/,$d')
          STATUS=$(echo "${HTTP_RESPONSE}" | grep "HTTP_STATUS:" | cut -d':' -f2)
          DURATION=$(echo "${HTTP_RESPONSE}" | grep "TIME_TOTAL:" | cut -d':' -f2)

          echo "Response Status: ${STATUS} (${DURATION}s)"
          echo "Response Body: ${BODY}"

          if [ "${STATUS}" != "200" ]; then
            echo "::warning::Discovery run returned HTTP ${STATUS}"
            # Don't fail the workflow on non-200 — partial results are OK
            # Only fail on network errors (empty status)
            if [ -z "${STATUS}" ]; then
              echo "::error::Network error — could not reach ${APP_URL}"
              exit 1
            fi
          fi

          echo "Discovery run completed in ${DURATION}s."

  # Keep the workflow alive — GitHub disables scheduled workflows after
  # 60 days of inactivity in the repository. This dummy commit prevents that.
  keepalive:
    name: Keep workflow active
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: discovery
    steps:
      - uses: actions/checkout@v4
      - name: Keepalive ping
        run: echo "Keepalive at $(date -u)" > /dev/null
